version: 2
updates:
  # Python dependencies managed by uv (pip ecosystem)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      ai-sdks:
        patterns:
          - "openai"
          - "anthropic"
          - "ollama"
          - "tiktoken"
      dev-tooling:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"

  # Security updates only (limit 0 disables version updates): group coupled stacks in uv.lock
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      langchain:
        applies-to: security-updates
        patterns:
          - "langchain*"
          - "langgraph*"
          - "langsmith"
      pydantic:
        applies-to: security-updates
        patterns:
          - "pydantic"
          - "pydantic-core"
          - "pydantic-settings"
      opentelemetry:
        applies-to: security-updates
        patterns:
          - "opentelemetry-*"
